name: Release

# Pushing a tag vX.Y.Z builds tzd for the usual platforms and publishes a
# GitHub release with the binaries and the tag's CHANGELOG.md section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check the version matches the tag
        run: |
          v=$(sed -n 's/^const Version = "\(.*\)"/\1/p' zenoh/admin.go)
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "zenoh.Version is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## $GITHUB_REF_NAME" CHANGELOG.md || { echo "no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
      - name: build tzd
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*} arch=${t#*/}
            name=tzd-$GITHUB_REF_NAME-$os-$arch
            mkdir -p "build/$name"
            ext=; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "build/$name/tzd$ext" ./cmd/tzd
            cp LICENSE LICENSE-EPL-2.0 NOTICE README.md CHANGELOG.md "build/$name/"
            if [ $os = windows ]; then (cd build && zip -qr "../dist/$name.zip" "$name")
            else tar -C build -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: release notes
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '
            index($0, tag) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
