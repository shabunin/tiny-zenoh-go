name: Nightly

# Long randomized runs of the in-process mesh simulation (zenoh/meshsim_test.go):
# each run draws a new topology and flap schedule, so repeating them every
# night covers more cases than the single TestMeshSim run in CI. A failure
# logs its seed; replay it with
#
#   ZENOH_MESHSIM=large ZENOH_MESHSIM_SEED=<seed> go test -run '^TestMeshSimLarge$' ./zenoh/

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: runs of each simulation
        default: "8"

permissions:
  contents: read

jobs:
  meshsim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: large
            run: "^TestMeshSimLarge$"
            flags: ""
          - name: race
            run: "^TestMeshSim(Large)?$"
            flags: "-race"
    name: meshsim (${{ matrix.name }})
    env:
      ZENOH_MESHSIM: large
      COUNT: ${{ inputs.count || '8' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ${{ matrix.flags }} -count=$COUNT -failfast -timeout 55m -run '${{ matrix.run }}' -v ./zenoh/ 2>&1 | tee meshsim.log; exit ${PIPESTATUS[0]}
      - name: failing seeds
        if: failure()
        run: grep -B2 -A2 -E 'seed [0-9]+|--- FAIL' meshsim.log | tail -60
