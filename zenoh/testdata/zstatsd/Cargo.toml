[package]
name = "zstatsd"
version = "0.1.0"
edition = "2021"

[dependencies]
zenoh = { version = "=1.10.2", default-features = false, features = ["transport_tcp", "transport_udp", "stats", "unstable", "internal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"

[profile.release]
debug = false
